name: Gerar estrutura comercial

on:
  push:
    branches: [feat/catalogo-comercial-kits]
    paths:
      - '.github/workflows/gerar-estrutura.yml'

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: feat/catalogo-comercial-kits
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Atualizar lockfile e instalar
        run: |
          npm install --package-lock-only
          npm ci
      - name: Gerar catálogo, kits e matriz
        run: |
          npm run gerar:catalogo
          npm run preparar:kits
          npm run matriz
      - name: Gates antes do commit
        run: |
          npm test
          npm run validar
          npm run verificar:secrets
          node scripts/verificar-release.mjs --somente-estrutura
      - name: Remover bootstrap e workflows temporários
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/materializar-bootstrap.yml
          rm -f .github/workflows/testes-tdd.yml
          rm -f .github/workflows/gerar-estrutura.yml
      - name: Commit da estrutura gerada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração para materializar.'
            exit 0
          fi
          git commit -m 'feat: materializa matriz kits e pacotes comerciais'
          git push origin HEAD:feat/catalogo-comercial-kits
