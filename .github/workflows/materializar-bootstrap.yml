name: Materializar bootstrap

on:
  push:
    branches:
      - feat/catalogo-comercial-kits
    paths:
      - '.github/workflows/materializar-bootstrap.yml'

permissions:
  contents: write

jobs:
  materializar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/catalogo-comercial-kits
          fetch-depth: 0

      - name: Testar hipótese de deslocamento no bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _bootstrap/extracted
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip

          parts = [Path(f'.bootstrap/part{i:02d}.b64').read_text().replace('\n','').replace('\r','') for i in range(6)]
          assert len(parts[0]) == 5999, len(parts[0])
          assert len(parts[4]) == 6001, len(parts[4])
          moved = parts[4][0]
          candidate = parts[0] + moved + ''.join(parts[1:4]) + parts[4][1:] + parts[5]
          raw = base64.b64decode(candidate, validate=True)
          data = gzip.decompress(raw)
          Path('_bootstrap/arvore.tar').write_bytes(data)
          print(f'hipotese_validada caractere={moved!r} bytes_tar={len(data)}')
          PY
          tar -xf _bootstrap/arvore.tar -C _bootstrap/extracted
          test -f _bootstrap/extracted/package.json
          test -d _bootstrap/extracted/kits
          test -d _bootstrap/extracted/catalogo
          test -d _bootstrap/extracted/scripts

      - name: Validar árvore antes de materializar
        working-directory: _bootstrap/extracted
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run validar
          npm run matriz

      - name: Materializar e remover bootstrap temporário
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob
          cp -a _bootstrap/extracted/. ./
          rm -rf .bootstrap _bootstrap
          rm -f .github/workflows/materializar-bootstrap.yml

      - name: Commit da implementação completa
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: materializa catalogo comercial e kits'
          git push origin HEAD:feat/catalogo-comercial-kits
