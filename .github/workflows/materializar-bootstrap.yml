name: Materializar bootstrap

on:
  push:
    branches:
      - feat/catalogo-comercial-kits
    paths:
      - '.github/workflows/materializar-bootstrap.yml'

permissions:
  contents: write

jobs:
  materializar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/catalogo-comercial-kits
          fetch-depth: 0

      - name: Diagnosticar fragmentos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _bootstrap
          total=0
          for f in .bootstrap/part*.b64; do
            limpo="$(tr -d '\r\n' < "$f")"
            n=${#limpo}
            total=$((total+n))
            printf '%s chars=%d mod4=%d inicio=%s fim=%s\n' "$f" "$n" "$((n%4))" "${limpo:0:8}" "${limpo: -8}"
          done
          echo "total=$total mod4=$((total%4))"
          cat .bootstrap/part*.b64 | tr -d '\r\n' > _bootstrap/arvore.b64
          base64 --decode _bootstrap/arvore.b64 > _bootstrap/arvore.tar.gz
          gzip -t _bootstrap/arvore.tar.gz

      - name: Reconstruir árvore testada
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _bootstrap/extracted
          tar -xzf _bootstrap/arvore.tar.gz -C _bootstrap/extracted
          test -f _bootstrap/extracted/package.json
          test -d _bootstrap/extracted/kits
          test -d _bootstrap/extracted/catalogo
          test -d _bootstrap/extracted/scripts
          if find _bootstrap/extracted \( -name .git -o -name node_modules \) -print | grep -q .; then
            echo 'Bootstrap contém diretório proibido.' >&2
            exit 1
          fi

      - name: Validar árvore antes de materializar
        working-directory: _bootstrap/extracted
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run validar
          npm run matriz

      - name: Materializar e remover bootstrap temporário
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob
          cp -a _bootstrap/extracted/. ./
          rm -rf .bootstrap _bootstrap
          rm -f .github/workflows/materializar-bootstrap.yml

      - name: Commit da implementação completa
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração para materializar.'
            exit 0
          fi
          git commit -m 'feat: materializa catalogo comercial e kits'
          git push origin HEAD:feat/catalogo-comercial-kits
