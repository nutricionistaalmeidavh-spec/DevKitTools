name: QA autocontidos temporário

on:
  push:
    branches: [feat/kits-autocontidos]
    paths:
      - '.github/workflows/qa-autocontidos-temp.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout somente DevKitTools
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar repositório
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run validar
          npm run validar:snapshots
          npm run verificar:secrets

      - name: Montar 63 kits e 8 pacotes sem utilidades
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          npm run montar:todos -- --todos --dist dist
          npm run montar:pacotes -- --todos
          npm run checksums
          total="$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')"
          test "$total" -eq 71
          test -f dist/SHA256SUMS.txt
          echo "ZIPs validados: $total"

      - name: Publicar evidência QA
        uses: actions/upload-artifact@v4
        with:
          name: qa-autocontidos-63-kits-8-pacotes
          path: dist/
          if-no-files-found: error
