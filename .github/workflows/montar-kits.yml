name: Montar kits

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'qa monta todos os kits habilitados; comercial monta somente itens prontos'
        required: true
        type: choice
        options:
          - qa
          - comercial
        default: qa

permissions:
  contents: read

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DevKitTools
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Testes
        run: npm test
      - name: Validar catálogo
        run: npm run validar
      - name: Validar snapshots locais
        run: npm run validar:snapshots
      - name: Verificar segredos
        run: npm run verificar:secrets

      - name: Montar todos em modo QA
        if: ${{ inputs.modo == 'qa' }}
        shell: bash
        run: |
          npm run montar:todos -- --todos --dist dist
          npm run montar:pacotes -- --todos
          npm run checksums

      - name: Montar itens comerciais prontos
        if: ${{ inputs.modo == 'comercial' }}
        shell: bash
        run: |
          npm run montar:todos -- --dist dist
          npm run montar:pacotes
          npm run checksums

      - name: Publicar artifact da montagem
        uses: actions/upload-artifact@v4
        with:
          name: kits-${{ inputs.modo }}
          path: dist/
          if-no-files-found: error
